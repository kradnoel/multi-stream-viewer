# @mudix-mz packages resolve from the private registry, not npmjs.org.
# Without this mapping Bun looks the scope up on npmjs.org and the install fails
# with a misleading "package not found".
#
# Authentication, if the registry requires it, comes from MUDIX_NPM_TOKEN in the
# environment. Never commit the token itself; CI reads it from a secret.
[install.scopes]
"@mudix-mz" = { url = "https://npmhub.mudix.co.mz/", token = "$MUDIX_NPM_TOKEN" }
