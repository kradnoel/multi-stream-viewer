# @mudix-mz packages resolve from the private registry, not npmjs.org.
# Without this mapping Bun looks the scope up on npmjs.org and the install fails
# with a misleading "package not found".
#
# Credentials are NOT kept here. Bun reads them from ~/.npmrc:
#   //npmhub.mudix.co.mz/:_authToken=...
# CI writes the same line from a secret before installing.
[install.scopes]
"@mudix-mz" = { url = "https://npmhub.mudix.co.mz/" }
