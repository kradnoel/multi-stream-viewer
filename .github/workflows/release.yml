name: release

# Tag-driven: pushing v0.2.0 builds the bundles and attaches them to a draft
# release. The tag is the trigger rather than a merge to main, so cutting a
# release is a deliberate act and main can move on without shipping anything.
#
# Run by hand it builds the same bundles and publishes nothing, so a change to
# this file can be tried without spending a version number on it. The macOS
# job failed for v0.2.0 and there was no way to test the fix but to tag again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# tauri-action creates the release and uploads to it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built for both architectures in one bundle so a single .dmg covers
          # Apple silicon and Intel. universal-apple-darwin is Tauri's name for
          # "build both and lipo them", not a rustup target, so rustup installs
          # the two real ones and only the bundler is told "universal".
          - os: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin

          # Pinned rather than ubuntu-latest: the AppImage links against the
          # glibc of whatever built it, so building on the oldest runner that
          # still has webkit2gtk-4.1 keeps it usable on older distributions.
          - os: ubuntu-22.04
            target: ''
            args: ''

          - os: windows-latest
            target: ''
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      # Same as the check workflow: @mudix-mz/carbonless will 401 without this.
      - name: Authenticate to the private registry
        shell: bash
        run: |
          if [ -z "${MUDIX_NPM_TOKEN}" ]; then
            echo "MUDIX_NPM_TOKEN secret is not set; the @mudix-mz install will 401." >&2
            exit 1
          fi
          echo "//npmhub.mudix.co.mz/:_authToken=${MUDIX_NPM_TOKEN}" > .npmrc
        env:
          MUDIX_NPM_TOKEN: ${{ secrets.MUDIX_NPM_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Left as a draft so the notes can be written and the bundles checked
      # before anyone can download them.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          # Empty on a manual run, which is what tells tauri-action to build
          # and stop. A release is only ever created from a tag.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MultiStream {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # A manual run has nowhere to put the bundles, so they are kept on the run
      # itself: downloadable for an hour of installing and watching a stream
      # play, and gone before anyone mistakes one for a release.
      - name: Keep the bundles on the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          # Two roots because the macOS job builds through lipo and the others
          # do not. A job that produced nothing should say so rather than
          # upload an empty archive and look like it worked.
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error
          retention-days: 7
